name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # The runner image preconfigures third-party apt repos we never use
      # (Google Chrome, etc.). When one of those mirrors serves a stale or
      # corrupt index (hash mismatch), `apt-get update` exits non-zero and
      # takes the whole job down — even though the only package we need,
      # libavahi-compat-libdnssd-dev, is a plain Ubuntu-universe package
      # whose index downloaded fine. Purge every non-Ubuntu source, then
      # tolerate a partial update failure so an unrelated mirror outage
      # can't block the build.
      run: |
        sudo rm -f /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources
        sudo apt-get update -qq || true
        sudo apt-get install -y libavahi-compat-libdnssd-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose --workspace
