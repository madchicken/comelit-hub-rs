name: Rust

on:
  workflow_dispatch:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  build:

    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
    - name: Install system dependencies
      # The runner image preconfigures third-party apt repos we never use
      # (Google Chrome, etc.). When one of those mirrors serves a stale or
      # corrupt index (hash mismatch), `apt-get update` exits non-zero and
      # takes the whole job down — even though the only package we need,
      # libavahi-compat-libdnssd-dev, is plain Ubuntu universe and its index
      # updates fine. Tolerate a partial update failure; the install below
      # still fails the job for real if the package genuinely can't be found.
      run: |
        sudo apt-get update -qq || true
        sudo apt-get install -y libavahi-compat-libdnssd-dev
    - name: Build
      run: cargo build --verbose
    - name: Run tests
      run: cargo test --verbose --workspace
